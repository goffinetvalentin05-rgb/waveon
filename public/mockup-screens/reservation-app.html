<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WaveOn — écran mockup « Réserver »</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --w: 390px;
        --h: 844px;
        --ink: #0a0a0a;
        --muted: #737373;
        --line: #f5f5f5;
        --slot-bg: #fafafa;
        --slot-border: #e5e5e5;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #d4d4d4;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /* Cadre export : taille logique proche iPhone 15 (tu peux zoom navigateur @2x / @3x avant capture) */
      .screen {
        width: var(--w);
        height: var(--h);
        background: #fff;
        color: var(--ink);
        padding: 92px 24px 32px;
        display: flex;
        flex-direction: column;
        text-align: center;
        box-shadow:
          inset 0 0 0 1px rgba(0, 0, 0, 0.06),
          inset 0 18px 40px -12px rgba(255, 255, 255, 0.65),
          inset 0 -10px 28px -14px rgba(0, 0, 0, 0.07),
          0 24px 64px rgba(0, 0, 0, 0.2);
        border-radius: 44px;
      }

      .label {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #a3a3a3;
      }

      .service {
        margin-top: 16px;
        font-family: "Instrument Serif", Georgia, serif;
        font-size: 1.15rem;
        font-weight: 400;
        line-height: 1.2;
        letter-spacing: -0.02em;
      }

      .duration {
        margin-top: 6px;
        font-size: 12px;
        color: var(--muted);
      }

      .section {
        margin-top: 20px;
      }

      .grid {
        margin-top: 10px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .slot {
        border-radius: 16px;
        padding: 10px 10px;
        font-size: 13px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        line-height: 1;
      }

      .slot--light {
        background: var(--slot-bg);
        border: 1px solid var(--slot-border);
        color: #404040;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      }

      .slot--dark {
        background: var(--ink);
        color: #fff;
        box-shadow: 0 4px 14px -4px rgba(0, 0, 0, 0.35);
      }

      .cta-wrap {
        margin-top: 28px;
      }

      .cta {
        width: 100%;
        border: none;
        border-radius: 16px;
        background: var(--ink);
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.01em;
        padding: 12px 16px;
        box-shadow: 0 8px 20px -6px rgba(0, 0, 0, 0.25);
        cursor: default;
      }

      .hint {
        position: fixed;
        bottom: 12px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 11px;
        color: #525252;
        max-width: 360px;
        text-align: center;
        padding: 8px 12px;
        background: rgba(255, 255, 255, 0.9);
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }

      @media print {
        .hint {
          display: none;
        }
        body {
          background: #fff;
        }
      }
    </style>
  </head>
  <body>
    <main class="screen" aria-label="Aperçu application réservation">
      <header>
        <p class="label">Réserver</p>
      </header>

      <div>
        <p class="service">Coupe + barbe</p>
        <p class="duration">45 min</p>
      </div>

      <section class="section">
        <p class="label">Créneaux</p>
        <div class="grid">
          <div class="slot slot--light">10:00</div>
          <div class="slot slot--dark">10:30</div>
          <div class="slot slot--light">11:00</div>
          <div class="slot slot--light">14:00</div>
        </div>
      </section>

      <div class="cta-wrap">
        <button type="button" class="cta">Réserver</button>
      </div>
    </main>

    <p class="hint">
      Plus simple : avec le site en local, ouvre
      <strong>/mockup-export</strong> (ex. http://localhost:3000/mockup-export) — mêmes dimensions, polices WaveOn,
      guide de capture intégré.
    </p>
  </body>
</html>
